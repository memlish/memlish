server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name turtle.manifoldsync.xyz;

    ssl_certificate         /etc/letsencrypt/live/turtle.manifoldsync.xyz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/turtle.manifoldsync.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/turtle.manifoldsync.xyz/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://memlish_reborn:7654;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
