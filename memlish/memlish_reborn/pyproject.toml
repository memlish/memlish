[project]
name = "memlish-reborn"
version = "0.1.0"
description = "Telegram inline bot that overlays text on semantically-matched meme templates."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "pillow>=10.4",
    "numpy>=1.26,<3",
    "torch>=2.2",
    "transformers>=4.44",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memlish_reborn"]
